<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Top Providers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .provider-card {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
    }
    .provider-card:hover {
      transform: translateY(-5px);
    }
    .provider-avatar {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
    }
    .ranking-badge {
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #ffc107;
      color: #212529;
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
    }
  </style>
</head>
<body  style="background-color:rgb(250, 237, 196) ">

<div class="container my-5">
  <h2 class="text-center mb-4">🏆 Top Service Providers</h2>
  
  <div class="row row-cols-1 row-cols-md-3 g-4">
    
    <!-- provider Card -->
    <div class="col">
      <div class="card provider-card text-center p-3">
        <img src="imgs/istockphoto-1961890405-612x612.jpg" class="provider-avatar mx-auto mb-2" alt="provider 1">
        <h5 class="card-title">Ahmad Al-Tamimi</h5>
        <p class="text-muted mb-1">Electrician</p>
        <p class="mb-1">⭐ 4.9 </p>
        <span class="ranking-badge">#1</span>
      </div>
    </div>

    <!-- Tasker Card -->
    <div class="col">
      <div class="card provider-card text-center p-3">
        <img src="imgs/gv.jpg" class="provider-avatar mx-auto mb-2" alt="provider 2">
        <h5 class="card-title">Fatima Youssef</h5>
        <p class="text-muted mb-1">cleaner</p>
        <p class="mb-1">⭐ 4.8 </p>
        <span class="ranking-badge">#2</span>
      </div>
    </div>

    <!-- Tasker Card -->
    <div class="col">
      <div class="card provider-card text-center p-3">
        <img src="imgs/nat.jpg" class="provider-avatar mx-auto mb-2" alt="provider 3">
        <h5 class="card-title">Khaled Mansour</h5>
        <p class="text-muted mb-1">plumber</p>
        <p class="mb-1">⭐ 4.7 </p>
        <span class="ranking-badge">#3</span>
      </div>
    </div>

  </div>
</div>
</body>
</html>
