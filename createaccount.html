<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account | TaskerApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ffc75f;
    }
    .register-container {
      max-width: 500px;
      margin-top: 80px;
      padding: 2rem;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="register-container">
    
    <img src="imgs/worker.png" alt="Logo" class="d-block mx-auto mb-4" style="height: 100px; ">
    <h3 class="text-center mb-4">Create Your Account</h3>
    
    <form action="create_account.php" method="post">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" placeholder="Your name" name="full_name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="example@email.com" name="email" required >
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" placeholder="07XXXXXXXX" name="phone"required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Create Password</label>
        <input type="password" class="form-control" id="password" placeholder="********" name="password"required>
      </div>

      <div class="mb-3 form-check">
      </div>

      <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>

    <div class="text-center mt-3">
      Already have an account? <a href="login.php">Login</a>
    </div>
  </div>
</div>
</body>
</html>
